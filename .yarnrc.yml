# The base layer reads its dependencies from node_modules/ (its nuxt.config.ts's
# dependenciesDir): no Plug'n'Play.
nodeLinker: node-modules

# solstice-nuxt from its merge request's branch (package.json), a git
# dependency Yarn fetches only from approved repositories.
approvedGitRepositories:
  - "https://gitlab.eclipse.org/eclipsefdn/software-dev/frameworks-and-tools/solstice-nuxt.git"
